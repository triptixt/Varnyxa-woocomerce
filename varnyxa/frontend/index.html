<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23121212'/%3E%3Ctext x='50' y='65' font-family='serif' font-size='50' font-weight='700' fill='%23FAF9F6' text-anchor='middle'%3EV%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="description" content="VARNYXA is an inclusive contemporary fashion marketplace celebrating refined tailoring, timeless heritage weaves, and everyday elegance for every generation." />
    <meta name="theme-color" content="#121212" />
    <title>VARNYXA — Inclusive Luxury & Contemporary Fashion</title>
    
    <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('varnyxa_theme') || 'white';
          if (saved === 'midnight-luxe') saved = 'black';
          if (saved === 'classic-ivory') saved = 'white';
          if (saved === 'emerald-edit') saved = 'light-green';
          if (saved === 'terracotta-earth' || saved === 'rose-atelier') saved = 'light-orange';
          document.documentElement.setAttribute('data-theme', saved);
          if (saved === 'black') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="theme-bg theme-text antialiased selection:bg-[#121212] selection:text-[#FAF9F6]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
